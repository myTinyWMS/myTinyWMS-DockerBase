name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag version (e.g. 1.6)"
        required: true
        default: "1.6"
      push_latest:
        description: "Also push latest tag"
        required: true
        type: boolean
        default: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Sury's Trixie ARM64 packages are still 7.4.33-30 (2026-10-21).
      # Restore ARM64 only after patched packages >= 1:7.4.33-31 are available
      # and tests/smoke.sh passes on ARM64. Never lower the security minimum.
      - name: Build image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: mytinywms-base:ci

      - name: Test image before publishing
        run: docker run --rm --platform linux/amd64 -i mytinywms-base:ci sh < tests/smoke.sh

      - name: Build and push version tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: mytinywms/mytinywms-base:${{ github.event.inputs.version }}

      - name: Build and push latest tag
        if: ${{ github.event.inputs.push_latest == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: mytinywms/mytinywms-base:latest
