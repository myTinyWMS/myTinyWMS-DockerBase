name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag version (e.g. 1.6)"
        required: true
        default: "1.6"
      push_latest:
        description: "Also push latest tag"
        required: true
        type: boolean
        default: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push version tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: mytinywms/mytinywms-base:${{ github.event.inputs.version }}

      - name: Build and push latest tag
        if: ${{ github.event.inputs.push_latest == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: mytinywms/mytinywms-base:latest
